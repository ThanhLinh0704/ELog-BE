services:
  mysql:
    image: mysql:8.0.40-debian
    container_name: elog-mysql
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-elog_db}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - elog-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: .
    image: elog-backend:latest
    container_name: elog-backend-app
    restart: always
    ports:
      - "80:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Ho_Chi_Minh
      DB_URL: jdbc:mysql://mysql:3306/elog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      CORS_ORIGINS: "https://elog.click,https://www.elog.click,https://elog-fe.vercel.app,http://localhost:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - elog-net

volumes:
  mysql_data:

networks:
  elog-net:
