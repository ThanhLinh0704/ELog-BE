# ── DEV profile — local MySQL ──
# Active automatically when spring.profiles.active=dev
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/elog_db
    username: root
    password: root   # Override via env var DB_PASSWORD in production
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true                  # Verbose SQL in dev only
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.elog: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO
